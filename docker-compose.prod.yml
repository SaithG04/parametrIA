x-backend-environment: &backend-environment
  NODE_ENV: ${NODE_ENV:-production}
  PORT: ${PORT:-3000}
  API_PREFIX: ${API_PREFIX:-api}
  FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:?Set FRONTEND_ORIGINS in .env.production}
  FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in .env.production}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env.production}
  ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?Set ACCESS_TOKEN_SECRET in .env.production}
  REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?Set REFRESH_TOKEN_SECRET in .env.production}
  ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
  REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-604800}
  REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-parametria_refresh}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  JWT_ISSUER: ${JWT_ISSUER:-parametria-api}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-parametria-web}
  IDEMPOTENCY_RETENTION_HOURS: ${IDEMPOTENCY_RETENTION_HOURS:-24}
  PASSWORD_RESET_TTL_SECONDS: ${PASSWORD_RESET_TTL_SECONDS:-1800}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: "${SMTP_FROM:-ParametrIA <no-reply@example.com>}"
  SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-10000}
  SMTP_GREETING_TIMEOUT_MS: ${SMTP_GREETING_TIMEOUT_MS:-10000}
  SMTP_SOCKET_TIMEOUT_MS: ${SMTP_SOCKET_TIMEOUT_MS:-30000}
  MINIO_BUCKET: ${MINIO_BUCKET:?Set MINIO_BUCKET in .env.production}
  S3_REGION: ${S3_REGION:-us-east-1}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  RUN_EVALUATION_WORKER: "false"
  TRUST_PROXY: "true"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [private]
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [private]
    logging: *default-logging

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env.production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.production}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [private]
    logging: *default-logging

  migrate:
    image: ${DOCKERHUB_NAMESPACE:-saithg04}/parametria-migrate:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      SEED_MODE: ${SEED_MODE:-admin-only}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Set DEMO_ADMIN_PASSWORD in .env.production}
      DEMO_INSTRUCTOR_PASSWORD: ${DEMO_INSTRUCTOR_PASSWORD:-}
      DEMO_STUDENT_PASSWORD: ${DEMO_STUDENT_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]
    logging: *default-logging

  backend:
    image: ${DOCKERHUB_NAMESPACE:-saithg04}/parametria-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      <<: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [private, proxy]
    logging: *default-logging

  worker:
    image: ${DOCKERHUB_NAMESPACE:-saithg04}/parametria-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    command: ["node", "dist/src/worker.js"]
    restart: unless-stopped
    environment:
      <<: *backend-environment
      RUN_EVALUATION_WORKER: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [private, proxy]
    logging: *default-logging

  web:
    image: ${DOCKERHUB_NAMESPACE:-saithg04}/parametria-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,noexec,nosuid
      - /var/run:size=1m,noexec,nosuid
      - /tmp:size=16m,noexec,nosuid
    security_opt: ["no-new-privileges:true"]
    networks: [proxy]
    logging: *default-logging

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    user: "0:0"
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/cloudflared_token"]
    secrets:
      - cloudflared_token
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt: ["no-new-privileges:true"]
    cap_add: [DAC_READ_SEARCH]
    cap_drop: [ALL]
    depends_on:
      web:
        condition: service_healthy
    networks: [proxy]
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  private:
    internal: true
  proxy:

secrets:
  cloudflared_token:
    file: ./secrets/cloudflared_token.txt
